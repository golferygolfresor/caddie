<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>trace</title>
<style>html,body{margin:0;background:#000;color:#0f0;font:12px monospace}canvas{display:block}pre{white-space:pre-wrap;word-break:break-all;color:#fff;background:#000;padding:8px}</style>
</head><body>
<canvas id="c"></canvas><pre id="out">working…</pre>
<script>
/* Satellite tracer. ?lat=&lng=&z=18&px=1024[&gx=lat,lng (green centre)][&tx=lat,lng (tee)][&cell=4][&dbg=1]
   Loads Esri World Imagery tiles into a canvas, classifies cells (fairway / sand / water / trees), extracts
   simplified polygons and prints them as JSON in lat/lng.  Output: {ok, stats, polys:{fairway,bunker,water,trees,green}} */

const q=new URLSearchParams(location.search);
const out=document.getElementById("out");
const C=document.getElementById("c"); const ctx=C.getContext("2d",{willReadFrequently:true});
let stats_ref=null;
const GOOGLE_KEY="AIzaSyDyJMWF0R2YOwPfL-gvPbCurmJtM3lRYhY"; let gsess=null;
async function ensureSrc(){ if(q.get("src")!=="google"||gsess) return; const r=await fetch(`https://tile.googleapis.com/v1/createSession?key=${GOOGLE_KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mapType:"satellite",language:"en-US",region:"TR"})}); if(!r.ok) throw new Error("google session "+r.status); gsess=(await r.json()).session; }
function tileUrl(z,x,y){ return gsess ? `https://tile.googleapis.com/v1/2dtiles/${z}/${x}/${y}?session=${gsess}&key=${GOOGLE_KEY}` : `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`; }
function traceView(o){ return new Promise(resolve=>{
  const lat=o.lat, lng=o.lng, z=o.z||18, px=o.px||1024, cell=o.cell||4, gx=o.gx||[];
  const n=256*Math.pow(2,z);
  const toPx=(la,lo)=>[(lo+180)/360*n, (1-Math.log(Math.tan(la*Math.PI/180)+1/Math.cos(la*Math.PI/180))/Math.PI)/2*n];
  const toLL=(X,Y)=>{ const lo=X/n*360-180; const t=Math.PI*(1-2*Y/n); const la=180/Math.PI*Math.atan(0.5*(Math.exp(t)-Math.exp(-t))); return [+la.toFixed(6),+lo.toFixed(6)]; };
  const [cx,cy]=toPx(lat,lng); const x0=Math.round(cx-px/2), y0=Math.round(cy-px/2);
  const mPerPx = 156543.03392*Math.cos(lat*Math.PI/180)/Math.pow(2,z);
  C.width=px; C.height=px; ctx.fillStyle="#000"; ctx.fillRect(0,0,px,px);
  const loads=[];
  for(let tX=Math.floor(x0/256); tX<=Math.floor((x0+px-1)/256); tX++) for(let tY=Math.floor(y0/256); tY<=Math.floor((y0+px-1)/256); tY++){
    loads.push(new Promise(res=>{ const im=new Image(); im.crossOrigin="anonymous";
      im.onload=()=>{ ctx.drawImage(im, tX*256-x0, tY*256-y0); res(im.naturalWidth||0); }; im.onerror=()=>res(0);
      im.src=tileUrl(z,tX,tY); }));
  }
  Promise.all(loads).then(ok=>{
    let img; try{ img=ctx.getImageData(0,0,px,px).data; }catch(e){ resolve({ok:false,error:String(e)}); return; }
    const G=Math.floor(px/cell); const cls=new Uint8Array(G*G); const V=new Float32Array(G*G); const F=new Float32Array(G*G*4);
    const hsv=(r,g,b)=>{ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0; if(d){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; } return [h, mx?d/mx:0, mx]; };
    for(let gy=0;gy<G;gy++) for(let gxi=0;gxi<G;gxi++){
      let r=0,g=0,b=0,c=0; for(let y=gy*cell;y<(gy+1)*cell;y++) for(let x=gxi*cell;x<(gxi+1)*cell;x++){ const i=(y*px+x)*4; r+=img[i];g+=img[i+1];b+=img[i+2];c++; }
      r/=c;g/=c;b/=c; const [hh,s,v]=hsv(r,g,b); const j=gy*G+gxi; V[j]=v; F[j*4]=hh; F[j*4+1]=s; F[j*4+2]=v; }
    const T2=new Float32Array(G*G);
    for(let y=2;y<G-2;y++) for(let x=2;x<G-2;x++){ let m=0,c=0; for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){ m+=V[(y+dy)*G+x+dx]; c++; } m/=c; let v2=0; for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){ v2+=(V[(y+dy)*G+x+dx]-m)**2; } T2[y*G+x]=Math.sqrt(v2/c); }
    // self-calibration: colour of the green centre (mown grass) is the reference for this hole's imagery
    let ref={h:145,s:0.40,v:0.45};
    if(gx.length===2){ const [gpx,gpy]=toPx(gx[0],gx[1]); const gcx=Math.floor((gpx-x0)/cell), gcy=Math.floor((gpy-y0)/cell); let hh=0,ss=0,vv=0,c=0;
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){ const j=(gcy+dy)*G+gcx+dx; if(j<0||j>=G*G) continue; hh+=F[j*4]; ss+=F[j*4+1]; vv+=F[j*4+2]; c++; } if(c){ const r2={h:hh/c,s:ss/c,v:vv/c}; if(r2.h>=80&&r2.h<=175&&r2.v>=0.30) ref=r2; } }
    const P=Object.assign({dh:25, dv:0.13, ds:0.18, ft2:0.05, wv:0.30, wt:0.015},o.P||{});
    for(let i=0;i<G*G;i++){ const hh=F[i*4], s=F[i*4+1], v=F[i*4+2], t2=T2[i]; let k=0;
      if((v>ref.v+0.15&&s<0.30)||(s<0.22&&v>ref.v+0.08&&(hh<70||hh>160))) k=2;                 // sand: pale (strict) or desaturated non-green (loose)
      else if(hh>=180&&hh<=240&&v<P.wv&&s>0.30&&t2<P.wt) k=3;                                 // water: teal, dark, very flat
      else if(Math.abs(hh-ref.h)<=P.dh&&v>=ref.v-P.dv&&Math.abs(s-ref.s)<=P.ds&&t2<P.ft2) k=1; // mown: like the green
      else if(hh>=50&&hh<=240&&(v<ref.v-0.2||t2>=P.ft2)) k=4;                                // trees / scrub
      else if(hh>=50&&hh<=175) k=5; cls[i]=k; }
    stats_ref=ref;
    for(let pass=0;pass<2;pass++){ const nc=new Uint8Array(cls); for(let y=1;y<G-1;y++) for(let x=1;x<G-1;x++){ const cnt=[0,0,0,0,0,0]; for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++) cnt[cls[(y+dy)*G+x+dx]]++; let best=0; for(let k=1;k<6;k++) if(cnt[k]>cnt[best]) best=k; nc[y*G+x]=best; } cls.set(nc); }
    const cellM=cell*mPerPx;
    function components(k){ const seen=new Uint8Array(G*G); const comps=[]; for(let i=0;i<G*G;i++){ if(cls[i]!==k||seen[i]) continue; const stack=[i], cellsIn=[]; seen[i]=1; while(stack.length){ const j=stack.pop(); cellsIn.push(j); const y=Math.floor(j/G), x=j%G; [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{ const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=G||ny>=G) return; const jj=ny*G+nx; if(cls[jj]===k&&!seen[jj]){ seen[jj]=1; stack.push(jj); } }); } comps.push(cellsIn); } return comps; }
    function outline(cellsIn){ const set=new Set(cellsIn); const edges=new Map(); const key=(x,y)=>x+","+y;
      cellsIn.forEach(j=>{ const y=Math.floor(j/G), x=j%G; const nb=(dx,dy)=>set.has((y+dy)*G+x+dx);
        if(!nb(0,-1)) addE(x,y,x+1,y); if(!nb(1,0)) addE(x+1,y,x+1,y+1); if(!nb(0,1)) addE(x+1,y+1,x,y+1); if(!nb(-1,0)) addE(x,y+1,x,y); });
      function addE(ax,ay,bx,by){ const a=key(ax,ay); if(!edges.has(a)) edges.set(a,[]); edges.get(a).push([bx,by]); }
      let best=[]; const used=new Set();
      for(const [start] of edges){ if(used.has(start)) continue; const ring=[]; let cur=start; let guard=0;
        while(cur&&!used.has(cur)&&guard++<200000){ used.add(cur); const [sx,sy]=cur.split(",").map(Number); ring.push([sx,sy]); const nx=(edges.get(cur)||[])[0]; cur=nx?key(nx[0],nx[1]):null; }
        if(ring.length>best.length) best=ring; }
      return best; }
    function simplify(pts,tol){ if(pts.length<4) return pts; const sq=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2; const dseg=(p,a,b)=>{ const l=sq(a,b); if(!l) return sq(p,a); let t=((p[0]-a[0])*(b[0]-a[0])+(p[1]-a[1])*(b[1]-a[1]))/l; t=Math.max(0,Math.min(1,t)); return sq(p,[a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])]); };
      const keep=new Uint8Array(pts.length); keep[0]=keep[pts.length-1]=1; const st=[[0,pts.length-1]];
      while(st.length){ const [i,j]=st.pop(); let md=0,mi=-1; for(let k=i+1;k<j;k++){ const d=dseg(pts[k],pts[i],pts[j]); if(d>md){md=d;mi=k;} } if(md>tol*tol&&mi>0){ keep[mi]=1; st.push([i,mi],[mi,j]); } }
      return pts.filter((p,i)=>keep[i]); }
    const toLatLng=p=>toLL(x0+p[0]*cell, y0+p[1]*cell);
    const tol=o.tol||1.2;
    const polysFor=(k,minArea,maxArea)=>components(k).filter(c=>{ const a=c.length*cellM*cellM; return a>=minArea&&(!maxArea||a<=maxArea); }).map(c=>simplify(outline(c),tol).map(toLatLng)).filter(p=>p.length>=4);
    const compact=c=>{ const xs=c.map(j=>j%G), ys=c.map(j=>Math.floor(j/G)); const w=Math.max(...xs)-Math.min(...xs)+1, hh=Math.max(...ys)-Math.min(...ys)+1; return c.length/(w*hh) > 0.35 && Math.max(w,hh)/Math.min(w,hh) < 4; };
    const bunker=components(2).filter(c=>{ const a=c.length*cellM*cellM; return a>=20&&a<=2500&&compact(c); }).map(c=>simplify(outline(c),1.0).map(toLatLng)).filter(p=>p.length>=4);
    const fill=c=>{ const xs=c.map(j=>j%G), ys=c.map(j=>Math.floor(j/G)); const w=Math.max(...xs)-Math.min(...xs)+1, hh=Math.max(...ys)-Math.min(...ys)+1; return c.length/(w*hh); };
    const water=components(3).filter(c=>{ const a=c.length*cellM*cellM; return a>=1500&&fill(c)>0.35; }).map(c=>simplify(outline(c),tol).map(toLatLng)).filter(p=>p.length>=4);
    { // erode sand by one cell to cut paths, then dilate back inside the original mask
      const er=new Uint8Array(G*G); for(let y=1;y<G-1;y++) for(let x=1;x<G-1;x++){ if(cls[y*G+x]!==2) continue; let ok=true; for(let dy=-1;dy<=1&&ok;dy++) for(let dx=-1;dx<=1;dx++) if(cls[(y+dy)*G+x+dx]!==2){ok=false;break;} if(ok) er[y*G+x]=1; }
      const di=new Uint8Array(G*G); for(let y=1;y<G-1;y++) for(let x=1;x<G-1;x++){ if(cls[y*G+x]!==2) continue; let any=false; for(let dy=-1;dy<=1&&!any;dy++) for(let dx=-1;dx<=1;dx++) if(er[(y+dy)*G+x+dx]){any=true;break;} if(any) di[y*G+x]=1; }
      for(let i=0;i<G*G;i++) if(cls[i]===2&&!di[i]) cls[i]=0; }
    const bunker2=components(2).filter(c=>{ const a=c.length*cellM*cellM; return a>=25&&a<=1500&&fill(c)>0.3; }).map(c=>simplify(outline(c),1.0).map(toLatLng)).filter(p=>p.length>=4);
    const polys={fairway:polysFor(1,800), bunker:bunker2, water, trees:o.trees?polysFor(4,400):[]};
    polys.green=[];
    if(gx.length===2){ const [gpx,gpy]=toPx(gx[0],gx[1]); const gcx=Math.floor((gpx-x0)/cell), gcy=Math.floor((gpy-y0)/cell);
      const comp=components(1).find(c=>c.includes(gcy*G+gcx)); const rad=(o.greenR||26)/cellM;
      const cellsIn = comp ? comp.filter(j=>{ const y=Math.floor(j/G), x=j%G; return Math.hypot(x-gcx,y-gcy)<=rad; }) : [];
      if(cellsIn.length>=4) polys.green=[simplify(outline(cellsIn),1.0).map(toLatLng)]; }
    const stats={tiles:ok.length,tilesLoaded:ok.filter(Boolean).length,cellMetres:+cellM.toFixed(2),ref:stats_ref&&{h:Math.round(stats_ref.h),s:+stats_ref.s.toFixed(2),v:+stats_ref.v.toFixed(2)}}; ["fairway","sand","water","trees","rough","other"].forEach((nm,i)=>stats[nm]=0);
    for(let i=0;i<G*G;i++) stats[["other","fairway","sand","water","trees","rough"][cls[i]]]++;
    resolve({ok:true,stats,polys});
  });
});}

/* ---- course mode: ?course=<golfapi courseID>[&holes=1-18][&tol=1.5] → traces every hole, keeps features within 70 m of the
   hole line, stores them as integer metre offsets from the tee, prints deflate+base64 JSON (progressively). ---- */
async function runCourse(){
  const id=q.get("course"); const c=window.API_COURSES[id]; if(!c){ out.textContent="unknown course"; return; }
  const range=(q.get("holes")||"1-18").split("-").map(Number); const H=[]; for(let i=range[0]; i<=(range[1]||range[0]); i++) H.push(i);
  await ensureSrc(); const result={id,src:gsess?"google":"esri",holes:{}}; window.RESULT=result;
  const dist2seg=(p,a,b)=>{ const l=(b[0]-a[0])**2+(b[1]-a[1])**2; let t=l?((p[0]-a[0])*(b[0]-a[0])+(p[1]-a[1])*(b[1]-a[1]))/l:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(p[0]-(a[0]+t*(b[0]-a[0])), p[1]-(a[1]+t*(b[1]-a[1]))); };
  for(const hno of H){
    const pts=c.pts.filter(a=>a[0]===hno); const tee=pts.find(a=>a[1]===11)||pts.find(a=>a[1]===12); const g=pts.find(a=>a[1]===1&&a[2]===2)||pts.find(a=>a[1]===1);
    if(!tee||!g) continue;
    const T=[tee[4],tee[5]], Gm=[g[4],g[5]]; const gf=pts.find(a=>a[1]===1&&a[2]===1), gb=pts.find(a=>a[1]===1&&a[2]===3);
    const kx=111320*Math.cos(T[0]*Math.PI/180), ky=110540; const toM=ll=>[(ll[1]-T[1])*kx,(ll[0]-T[0])*ky];
    const len=Math.hypot(...toM(Gm)); const z=+(q.get("z")||18); const mpp=156543.03392*Math.cos(T[0]*Math.PI/180)/Math.pow(2,z); const cell=+(q.get("cell")||4);
    const px=Math.min(4096, Math.max(768, Math.round((len+160)/mpp/64)*64));
    const centre=[(T[0]+Gm[0])/2,(T[1]+Gm[1])/2];
    const greenR = (gf&&gb) ? Math.max(12, Math.hypot((gb[5]-gf[5])*kx,(gb[4]-gf[4])*ky)/2+5) : 22;
    const r=await traceView({lat:centre[0],lng:centre[1],px,z,cell,gx:Gm,greenR,tol:+(q.get("tol")||1.5)});
    if(q.get("dump")){ window.DUMPS=window.DUMPS||{}; window.DUMPS[hno]=C.toDataURL("image/jpeg",0.85); }
    if(!r.ok){ result.holes[hno]={err:r.error}; continue; }
    const corridor=70; const seg=[ [0,0], toM(Gm) ];
    const keep=(poly,cor)=>{ const m=poly.map(toM); return m.some(p=>dist2seg(p,seg[0],seg[1])<=cor) ? m.map(p=>[Math.round(p[0]),Math.round(p[1])]) : null; };
    const pick=(arr,cor)=>arr.map(p=>keep(p,cor||corridor)).filter(Boolean);
    result.holes[hno]={len:Math.round(len), f:pick(r.polys.fairway,30), b:pick(r.polys.bunker,45), w:pick(r.polys.water,70), g:pick(r.polys.green,40), s:[r.stats.fairway,r.stats.sand,r.stats.water,r.stats.trees,r.stats.rough], ref:r.stats.ref};
    await emit(result, hno);
  }
  await emit(result, "done"); window.DONE=true;
}
async function emit(obj, tag){
  const json=JSON.stringify(obj); const cs=new CompressionStream("deflate-raw"); const w=cs.writable.getWriter(); w.write(new TextEncoder().encode(json)); w.close();
  const buf=await new Response(cs.readable).arrayBuffer(); let bin=""; new Uint8Array(buf).forEach(b=>bin+=String.fromCharCode(b));
  out.textContent=`CADDIE:${tag}:${json.length}:`+btoa(bin)+"\n"+(tag==="done"?"PAD\n"+("x".repeat(99)+"\n").repeat(900):"");
}
if(q.get("course")){ const s=document.createElement("script"); s.src="courses.js"; s.onload=runCourse; document.head.appendChild(s); }
else if(q.get("lat")){ traceView({lat:+q.get("lat"),lng:+q.get("lng"),z:+(q.get("z")||18),px:+(q.get("px")||1024),gx:(q.get("gx")||"").split(",").map(Number).filter(x=>!isNaN(x)),trees:true}).then(r=>out.textContent=JSON.stringify(q.get("only")==="stats"?{ok:r.ok,stats:r.stats}:r)); }
</script></body></html>
