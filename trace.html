<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>trace</title>
<style>html,body{margin:0;background:#000}#g{position:relative;overflow:hidden}#g img{position:absolute;width:256px;height:256px}</style>
</head><body><div id="g"></div>
<script>
// Georeferenced satellite capture: ?lat=&lng=&z=18&px=1536 renders a px×px square of Esri World Imagery centred on lat/lng.
// Pixel (x,y) ↔ Web Mercator: worldPx = 256*2^z; px0 = centre - px/2.
const q=new URLSearchParams(location.search); const lat=+q.get("lat"), lng=+q.get("lng"), z=+(q.get("z")||18), px=+(q.get("px")||1536);
const n=256*Math.pow(2,z);
const cx=(lng+180)/360*n, cy=(1-Math.log(Math.tan(lat*Math.PI/180)+1/Math.cos(lat*Math.PI/180))/Math.PI)/2*n;
const x0=Math.round(cx-px/2), y0=Math.round(cy-px/2);
const g=document.getElementById("g"); g.style.width=px+"px"; g.style.height=px+"px";
for(let tx=Math.floor(x0/256); tx<=Math.floor((x0+px)/256); tx++) for(let ty=Math.floor(y0/256); ty<=Math.floor((y0+px)/256); ty++){
  const im=document.createElement("img"); im.src=`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${ty}/${tx}`;
  im.style.left=(tx*256-x0)+"px"; im.style.top=(ty*256-y0)+"px"; g.appendChild(im);
}
document.title=`x0=${x0} y0=${y0} z=${z} px=${px}`;
</script></body></html>
