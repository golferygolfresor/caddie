name: preview
on:
  push:
    branches: [preview]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.0 && npx playwright install --with-deps chromium
      - name: check Google Map Tiles session
        run: |
          curl -sS -X POST "https://tile.googleapis.com/v1/createSession?key=AIzaSyDyJMWF0R2YOwPfL-gvPbCurmJtM3lRYhY" -H "Content-Type: application/json" -d '{"mapType":"satellite","language":"en-US","region":"TR"}' | head -c 600; echo
      - run: (python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 1 && node preview/render.js
      - name: publish screenshots to the previews branch
        run: |
          git config user.name preview-bot && git config user.email bot@example.com
          mkdir -p /tmp/out && cp preview/out/*.png /tmp/out/
          git fetch origin previews || true
          git checkout -B previews origin/previews 2>/dev/null || git checkout --orphan previews
          git rm -rf --quiet . 2>/dev/null || true
          cp /tmp/out/*.png . && git add *.png && git commit -m "preview $(date -u +%H:%M)" && git push -f origin previews
